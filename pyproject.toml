[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nz-ocean-heat-anomaly-monitor"
version = "0.1.0"
description = "NZ coastal ocean heat anomaly monitoring pipeline"
requires-python = ">=3.10,<3.12"

dependencies = [
    "pandas",
    "geopandas",
    "xarray",
    "requests",
    "sqlalchemy",
    "psycopg2-binary",
    "python-dotenv",
    "pyarrow",
    "netcdf4",
    "h5netcdf",
    "shapely",
    "numpy"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nzheat*"]